<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>Portal Academico</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;color:#222}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left}
th{background:#f0f0f0}.msg{background:#fff3cd;padding:8px 12px;margin:10px 0;border-radius:4px}
input{padding:6px;margin:4px 0}button{padding:6px 14px}
</style></head><body>
<h1>Portal Academico (laboratorio)</h1>
{% with m = get_flashed_messages() %}{% for x in m %}<div class="msg">{{ x }}</div>{% endfor %}{% endwith %}
{% block c %}{% endblock %}
</body></html>
