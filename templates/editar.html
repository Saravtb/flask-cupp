{% extends "base.html" %}{% block c %}
<h2>Notas de {{ aluno.nome }}</h2><p><a href="/painel">Voltar</a></p>
<form method="post">
{% if hardened %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
<table><tr><th>Materia</th><th>Nota</th></tr>
{% for n in notas %}<tr><td>{{ n.materia }}</td>
<td><input name="{{ n.id }}" value="{{ n.nota }}" size="5"></td></tr>{% endfor %}
</table><br><button type="submit">Salvar</button></form>{% endblock %}
